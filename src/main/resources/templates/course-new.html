<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>강좌 개설</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .img-preview{width:100%;max-width:360px;aspect-ratio:16/9;object-fit:cover;border:1px dashed #dee2e6;border-radius:.5rem;background:#f8f9fa}
        .required::after{content:" *"; color:#dc3545;}
    </style>
</head>
<body>
<div class="container py-4">
    <div class="d-flex align-items-center mb-3">
        <a href="/tutor/courses" class="btn btn-outline-secondary me-2">&larr; 목록</a>
        <h1 class="h4 mb-0">강좌 개설</h1>
    </div>

    <form th:action="@{/tutor/courses}" method="post" th:object="${form}" class="needs-validation" novalidate>
        <!-- Spring Security CSRF -->
        <!--<input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />-->

        <div class="row g-4">
            <!-- 왼쪽: 입력 -->
            <div class="col-12 col-lg-7">

                <!-- 카테고리 -->
                <div class="mb-3">
                    <label for="categoryId" class="form-label required">카테고리</label>
                    <select id="categoryId" class="form-select" required th:field="*{categoryId}">
                        <option value="" hidden>카테고리를 선택하세요</option>
                        <option th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.categoryName}">
                        </option>
                    </select>
                    <div class="invalid-feedback">카테고리를 선택해 주세요.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('categoryId')}"
                         th:errors="*{categoryId}"></div>
                </div>

                <!-- 제목 -->
                <div class="mb-3">
                    <label for="title" class="form-label required">강좌 제목</label>
                    <input id="title" type="text" class="form-control"
                           placeholder="예) 스프링 부트로 만드는 REST API"
                           th:field="*{title}" required maxlength="100" />
                    <div class="invalid-feedback">제목을 입력해 주세요.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('title')}"
                         th:errors="*{title}"></div>
                </div>

                <!-- 설명 -->
                <div class="mb-3">
                    <label for="description" class="form-label">강좌 설명</label>
                    <textarea id="description" class="form-control" rows="6"
                              placeholder="강좌 개요, 수강 대상, 선행 지식 등을 적어 주세요."
                              maxlength="2000"
                              th:field="*{description}"></textarea>
                    <div class="text-danger small" th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}"></div>
                </div>

                <!-- 가격(포인트) -->
                <div class="mb-3">
                    <label for="pointAmount" class="form-label required">포인트</label>
                    <div class="input-group">
                        <input id="pointAmount" type="number" min="0" step="1"
                               class="form-control" placeholder="예) 10000"
                               th:field="*{pointAmount}" required />
                        <span class="input-group-text">P</span>
                    </div>
                    <div class="form-text">0이면 ‘무료’로 표시됩니다.</div>
                    <div class="invalid-feedback">포인트를 입력해 주세요.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('pointAmount')}"
                         th:errors="*{pointAmount}"></div>
                </div>

                <!-- 제출/취소 -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">강좌 개설하기</button>
                    <a href="/tutor/courses" class="btn btn-outline-secondary">취소</a>
                </div>
            </div>

            <!-- 오른쪽: 이미지 미리보기 -->
            <div class="col-12 col-lg-5">
                <div class="mb-2">
                    <label for="imageUrl" class="form-label">썸네일 이미지 URL</label>
                    <input id="imageUrl" type="url" class="form-control"
                           placeholder="https://example.com/thumbnail.jpg"
                           th:field="*{imageUrl}" />
                    <div class="form-text">이미지 URL을 입력하면 아래에 미리보기 됩니다.</div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('imageUrl')}"
                         th:errors="*{imageUrl}"></div>
                </div>

                <img id="preview" class="img-preview" alt="썸네일 미리보기"
                     src="data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='640' height='360'%3E%3Crect width='100%25' height='100%25' fill='%23f8f9fa'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' fill='%236c757d' font-size='16'%3E이미지 미리보기%3C/text%3E%3C/svg%3E" />
            </div>
        </div>
    </form>
</div>

<script>
    // 부트스트랩 기본 폼 검증
    (function () {
        'use strict';
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    })();

    // 이미지 URL 미리보기
    const imageUrlInput = document.getElementById('imageUrl');
    const preview = document.getElementById('preview');
    function updatePreview() {
        const url = imageUrlInput.value?.trim();
        if (!url) return;
        preview.src = url;
    }
    imageUrlInput?.addEventListener('change', updatePreview);
    imageUrlInput?.addEventListener('blur', updatePreview);
</script>
</body>
</html>
