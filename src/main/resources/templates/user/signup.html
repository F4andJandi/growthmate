<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - GrowthMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
        .signup-container {
            max-width: 450px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-5">
        <div class="signup-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-person-plus"></i> 회원가입
                    </h2>
                    
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
                    
                    <form id="signupForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">이메일 (아이디)</label>
                            <input type="email" class="form-control" id="username" name="username" 
                                   placeholder="example@email.com" required>
                            <small class="text-muted">이메일 형식으로 입력해주세요.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="passwordConfirm" class="form-label">비밀번호 확인</label>
                            <input type="password" class="form-control" id="passwordConfirm" required>
                            <small id="passwordMatch" class="text-danger d-none">비밀번호가 일치하지 않습니다.</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="role" class="form-label">회원 유형</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="">선택해주세요</option>
                                <option value="STUDENT">수강생</option>
                                <option value="INSTRUCTOR">강사</option>
                            </select>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-person-plus"></i> 회원가입
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="mb-0">
                            이미 계정이 있으신가요? 
                            <a th:href="@{/login}" class="text-decoration-none">로그인</a>
                        </p>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <a th:href="@{/}" class="text-secondary small text-decoration-none">
                            <i class="bi bi-arrow-left"></i> 메인으로 돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('passwordConfirm').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const passwordConfirm = this.value;
            const matchDiv = document.getElementById('passwordMatch');
            
            if (passwordConfirm && password !== passwordConfirm) {
                matchDiv.classList.remove('d-none');
            } else {
                matchDiv.classList.add('d-none');
            }
        });
        
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const passwordConfirm = document.getElementById('passwordConfirm').value;
            const role = document.getElementById('role').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            
            if (password !== passwordConfirm) {
                errorDiv.textContent = '비밀번호가 일치하지 않습니다.';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            if (!role) {
                errorDiv.textContent = '회원 유형을 선택해주세요.';
                errorDiv.classList.remove('d-none');
                return;
            }
            
            try {
                const response = await fetch('/api/users/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        role: role
                    })
                });
                
                if (response.ok) {
                    successDiv.textContent = '회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.';
                    successDiv.classList.remove('d-none');
                    
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    const errorText = await response.text();
                    errorDiv.textContent = errorText || '회원가입에 실패했습니다.';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                errorDiv.textContent = '회원가입 중 오류가 발생했습니다.';
                errorDiv.classList.remove('d-none');
                console.error('Signup error:', error);
            }
        });
    </script>
</body>
</html>
