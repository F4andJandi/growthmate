<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - GrowthMate</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
        .login-container {
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-5">
        <div class="login-container">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right"></i> 로그인
                    </h2>
                    
                    <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>
                    <div id="successMessage" class="alert alert-success d-none" role="alert"></div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="username" class="form-label">아이디</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">비밀번호</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-box-arrow-in-right"></i> 로그인
                            </button>
                        </div>
                    </form>
                    
                    <div class="text-center">
                        <p class="mb-0">
                            계정이 없으신가요? 
                            <a th:href="@{/signup}" class="text-decoration-none">회원가입</a>
                        </p>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <a th:href="@{/}" class="text-secondary small text-decoration-none">
                            <i class="bi bi-arrow-left"></i> 메인으로 돌아가기
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');
            
            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });
                
                const responseBody = await response.text();
                
                if (!response.ok) {
                    const message = responseBody || '로그인에 실패했습니다.';
                    errorDiv.textContent = message;
                    errorDiv.classList.remove('d-none');
                    return;
                }

                let parsed;
                try {
                    parsed = responseBody ? JSON.parse(responseBody) : null;
                } catch (parseError) {
                    parsed = null;
                }

                const successMessage = parsed && parsed.username
                        ? `${parsed.username}님, 로그인 되었습니다.`
                        : '로그인 성공!';

                successDiv.textContent = successMessage;
                    successDiv.classList.remove('d-none');
                    
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
            } catch (error) {
                errorDiv.textContent = '로그인 중 오류가 발생했습니다.';
                errorDiv.classList.remove('d-none');
                console.error('Login error:', error);
            }
        });
    </script>
</body>
</html>
