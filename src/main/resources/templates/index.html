<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowthMate - 메인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
        .sidebar {
            position: sticky;
            top: 80px;
            height: calc(100vh - 100px);
            overflow-y: auto;
        }
        .category-item {
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 0.375rem;
            padding: 0.5rem;
        }
        .category-item:hover {
            background-color: #f8f9fa;
        }
        .category-item.active {
            background-color: #e7f1ff;
            color: #0d6efd;
            font-weight: 600;
        }
        .course-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
        .course-card img {
            object-fit: cover;
            height: 180px;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container-fluid py-4">
        <div class="row">
            <!-- 좌측: 카테고리 리스트 -->
            <aside class="col-12 col-md-3 col-lg-2 mb-4">
                <div class="card sidebar">
                    <div class="card-header bg-white">
                        <h5 class="mb-0">
                            <i class="bi bi-grid"></i> 카테고리
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="list-group list-group-flush">
                            <a th:href="@{/}" 
                               class="list-group-item list-group-item-action category-item"
                               th:classappend="${selectedCategoryId == null} ? 'active' : ''">
                                <i class="bi bi-list"></i> 전체
                            </a>
                            <a th:each="category : ${categories}"
                               th:href="@{/?categoryId={id}(id=${category.id})}"
                               class="list-group-item list-group-item-action category-item"
                               th:classappend="${selectedCategoryId != null and selectedCategoryId == category.id} ? 'active' : ''">
                                <span th:text="${category.categoryName}">카테고리명</span>
                            </a>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- 가운데: 강좌 카드 리스트 -->
            <main class="col-12 col-md-9 col-lg-10">
                <!-- 메시지 표시 -->
                <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
                    [[${message}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    [[${error}]]
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                
                <div class="mb-4">
                    <h2 class="mb-1" th:text="${selectedCategoryName != null ? selectedCategoryName + ' 강좌' : '전체 강좌'}">
                        전체 강좌
                    </h2>
                    <small class="text-muted" th:text="'총 ' + ${#lists.size(courses)} + '개 강좌'">
                        총 0개 강좌
                    </small>
                </div>

                <!-- 강좌가 없는 경우 -->
                <div th:if="${#lists.isEmpty(courses)}" class="text-center py-5 text-muted border rounded bg-white">
                    <i class="bi bi-inbox" style="font-size: 3rem;"></i>
                    <p class="mt-3">아직 등록된 강좌가 없습니다.</p>
                </div>

                <!-- 강좌 카드 리스트 -->
                <div class="row g-4" th:if="${!#lists.isEmpty(courses)}">
                    <div class="col-12 col-sm-6 col-lg-4 col-xl-3" th:each="course : ${courses}">
                        <div class="card h-100 course-card">
                            <!-- 썸네일 -->
                            <div th:if="${course.imageUrl != null}">
                                <img th:src="${course.imageUrl}"
                                     class="card-img-top"
                                     alt="강좌 썸네일">
                            </div>
                            <div th:if="${course.imageUrl == null}">
                                <div class="card-img-top d-flex align-items-center justify-content-center bg-light"
                                     style="height:180px;">
                                    <i class="bi bi-image" style="font-size: 3rem; color: #dee2e6;"></i>
                                </div>
                            </div>

                            <!-- 내용 -->
                            <div class="card-body d-flex flex-column">
                                <h6 class="card-title mb-2 text-truncate" th:text="${course.title}">
                                    강좌 제목
                                </h6>

                                <p class="card-text small text-muted mb-3 flex-grow-1"
                                   th:text="${course.description != null ? (#strings.abbreviate(course.description, 50)) : '설명이 없습니다.'}">
                                    강좌 설명 미리보기 텍스트가 들어갑니다.
                                </p>

                                <!-- 포인트 / 가격 -->
                                <div class="mt-auto d-flex justify-content-between align-items-center gap-2">
                                    <span class="fw-semibold text-primary small"
                                          th:text="${#numbers.formatInteger(course.pointAmount, 0, 'COMMA')} + ' P'">
                                        0 P
                                    </span>

                                    <div class="d-flex gap-1">
                                        <a th:href="@{/sections?courseId={id}(id=${course.id})}"
                                           class="btn btn-sm btn-outline-primary" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">
                                            <i class="bi bi-eye"></i> 상세
                                        </a>
                                        <form th:action="@{/courses/{id}/enroll(id=${course.id})}" 
                                              method="post" 
                                              style="display: inline;"
                                              th:if="${loginUserId != null and loginUserRole != null and loginUserRole.name() == 'STUDENT'}">
                                            <button type="submit" class="btn btn-sm btn-success" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">
                                                <i class="bi bi-bookmark-plus"></i> 신청
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
