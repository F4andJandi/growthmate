<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포인트 충전</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      padding-top: 60px;
    }
  </style>
</head>
<body>
  <!-- 전역 헤더 -->
  <div th:replace="~{fragments/header :: header}"></div>
  
  <div class="container py-4">
    <h1>포인트 충전</h1>

<form th:action="@{/points/charge}" method="post" th:object="${reqBody}">
  <div class="mb-3">
    <label class="form-label">충전금액:</label>
    <input type="number" class="form-control" th:field="*{amount}" min="1000" required> 원
    <small class="text-muted">최소 1,000원 이상 충전 가능합니다.</small>
  </div>

  <div class="mb-3">
    <label class="form-label">결제 수단:</label>
    <div class="form-check">
      <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="CARD" id="paymentCard" required>
      <label class="form-check-label" for="paymentCard">신용카드 일반결제</label>
    </div>
  </div>

  <div class="mb-3">
    <p class="fw-bold">유의사항:</p>
    <ul class="small text-muted">
      <li>충전된 포인트는 환불이 불가능합니다.</li>
      <li>포인트는 강좌 수강 신청 시 사용됩니다.</li>
      <li>최소 충전 금액은 1,000원입니다.</li>
    </ul>
  </div>

  <div class="mb-3">
    <button type="submit" class="btn btn-primary">
      <i class="bi bi-credit-card"></i> 충전하기
    </button>
  </div>
</form>

    <a th:href="@{/points}" class="btn btn-outline-secondary mt-3">
      <i class="bi bi-arrow-left"></i> 포인트 내역으로 돌아가기
    </a>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
