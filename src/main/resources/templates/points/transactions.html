<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>포인트 내역</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <style>
    body {
      padding-top: 60px;
    }
  </style>
</head>
<body>
  <!-- 전역 헤더 -->
  <div th:replace="~{fragments/header :: header}"></div>
  
  <div class="container py-4">
    <h1>포인트 내역</h1>

<div class="card mb-4">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h5 class="card-title mb-1">현재 포인트</h5>
        <p class="mb-0">
          <strong class="text-primary fs-4" th:text="${#numbers.formatInteger(currentPoints, 0, 'COMMA')} + ' P'">0 P</strong>
        </p>
      </div>
      <a th:href="@{/points/charge}" class="btn btn-primary">
        <i class="bi bi-plus-circle"></i> 충전하기
      </a>
    </div>
  </div>
</div>

<h2 class="mb-3">전체 내역</h2>
<div class="card">
  <div class="card-body">
    <div th:if="${#lists.isEmpty(pointTransactions)}" class="text-center text-muted py-5">
      <i class="bi bi-inbox" style="font-size: 3rem;"></i>
      <p class="mt-3">포인트 거래 내역이 없습니다.</p>
    </div>
    <div th:if="${!#lists.isEmpty(pointTransactions)}">
      <div class="table-responsive">
        <table class="table table-hover">
          <thead class="table-light">
          <tr>
            <th>날짜</th>
            <th>설명</th>
            <th class="text-end">금액</th>
            <th class="text-end">잔액</th>
          </tr>
          </thead>
          <tbody>
          <tr th:each="point : ${pointTransactions}">
            <td th:text="${#temporals.format(point.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2025-01-01 12:00:00</td>
            <td th:text="${point.description}">포인트 적립</td>
            <td class="text-end" th:classappend="${point.amount > 0} ? 'text-success' : 'text-danger'">
              <span th:if="${point.amount > 0}" th:text="'+' + ${#numbers.formatInteger(point.amount, 0, 'COMMA')} + ' P'">+1,000 P</span>
              <span th:if="${point.amount < 0}" th:text="${#numbers.formatInteger(point.amount, 0, 'COMMA')} + ' P'">-1,000 P</span>
              <span th:if="${point.amount == 0}" th:text="'0 P'">0 P</span>
            </td>
            <td class="text-end fw-semibold" th:text="${#numbers.formatInteger(point.balanceAfter, 0, 'COMMA')} + ' P'">10,000 P</td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
  </div>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
