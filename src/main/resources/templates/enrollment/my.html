<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 강좌 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
        .course-card {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .course-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">내 강좌</h1>
                <p class="text-muted mb-0" th:text="'수강중인 강좌 ' + ${#lists.size(enrollments)} + '개'">
                    수강중인 강좌 0개
                </p>
            </div>
            <div class="btn-group">
                <a th:href="@{/edit}" class="btn btn-outline-primary">
                    <i class="bi bi-pencil"></i> 편집
                </a>
                <a th:href="@{/hidden}" class="btn btn-outline-secondary">
                    <i class="bi bi-eye-slash"></i> 숨김 강좌
                </a>
            </div>
        </div>

        <!-- 강좌가 없는 경우 -->
        <div th:if="${#lists.isEmpty(enrollments)}" class="text-center py-5 text-muted border rounded bg-white">
            <i class="bi bi-inbox" style="font-size: 3rem;"></i>
            <p class="mt-3">수강중인 강좌가 없습니다.</p>
            <a th:href="@{/}" class="btn btn-primary mt-2">
                <i class="bi bi-search"></i> 강좌 찾아보기
            </a>
        </div>

        <!-- 강좌 카드 리스트 -->
        <div class="row g-4" th:if="${!#lists.isEmpty(enrollments)}">
            <div class="col-12 col-sm-6 col-lg-4" th:each="enroll : ${enrollments}">
                <div class="card h-100 course-card">
                    <div class="card-body d-flex flex-column">
                        <div class="d-flex align-items-start mb-2">
                            <span class="badge bg-primary me-2" th:text="${enroll.orderNum}">1</span>
                            <h6 class="card-title mb-0 flex-grow-1" th:text="${enroll.course.title}">
                                강좌명
                            </h6>
                        </div>
                        <p class="card-text small text-muted mb-3 flex-grow-1"
                           th:text="${enroll.course.description != null ? (#strings.abbreviate(enroll.course.description, 50)) : '설명이 없습니다.'}">
                            강좌 설명
                        </p>
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <small class="text-muted">
                                    <i class="bi bi-clock"></i> 
                                    <span th:text="${enroll.progress}">진행률</span>
                                </small>
                                <small class="text-muted">
                                    <i class="bi bi-check-circle"></i> 
                                    <span th:text="${enroll.status}">상태</span>
                                </small>
                            </div>
                            <a th:href="@{|/sections?courseId=${enroll.course.id}|}" 
                               class="btn btn-sm btn-primary w-100">
                                <i class="bi bi-arrow-right-circle"></i> 학습하기
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
