<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강좌 순서 편집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-4">
        <h1>내 강좌 편집</h1>
        <a href="/enrollment/myList" class="btn btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i> 돌아가기
        </a>
        <hr>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead class="table-light">
                        <tr>
                            <th>순서</th>
                            <th>강좌명</th>
                            <th>액션</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="enroll : ${enrollments}">
                            <td><span class="badge bg-primary" th:text="${enroll.orderNum}">1</span></td>
                            <td th:text="${enroll.course.title}">강좌명</td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    <form th:action="@{/enrollment/change-order}" method="post" style="display:inline;">
                                        <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                                        <div class="input-group">
                                            <input type="number" name="newOrderNum" placeholder="새 순서" min="1"
                                                   th:max="${#lists.size(enrollments)}" class="form-control form-control-sm" style="width: 80px;">
                                            <button type="submit" class="btn btn-outline-primary btn-sm">순서 변경</button>
                                        </div>
                                    </form>

                                    <form th:action="@{/enrollment/hide}" method="post" style="display:inline;">
                                        <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                                        <button type="submit" class="btn btn-outline-warning btn-sm">강좌 숨기기</button>
                                    </form>

                                    <form th:action="@{/enrollment/refund}" method="post" style="display:inline;">
                                        <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                                        <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('정말 환불하시겠습니까?')">강좌 환불</button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(enrollments)}">
                            <td colspan="3" class="text-center text-muted py-4">
                                <i class="bi bi-inbox"></i> 편집할 강좌가 없습니다.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
