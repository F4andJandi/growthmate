<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 강좌 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 th:text="|${userId}님의 수강중인 강좌 목록|">내 강좌 목록</h1>
            <div class="btn-group">
                <a href="/enrollment/edit" class="btn btn-outline-primary">
                    <i class="bi bi-pencil"></i> 편집
                </a>
                <a href="/enrollment/hiddenList" class="btn btn-outline-secondary">
                    <i class="bi bi-eye-slash"></i> 숨김 강좌 보기
                </a>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" 
                        th:each="enroll : ${enrollments}">
                        <div>
                            <span class="badge bg-primary me-2" th:text="${enroll.orderNum}">1</span>
                            <span th:text="${enroll.course.title}">강좌명</span>
                        </div>
                        <a th:href="@{|/sections?courseId=${enroll.course.id}|}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-arrow-right-circle"></i> 선택
                        </a>
                    </li>
                    <li class="list-group-item text-center text-muted" th:if="${#lists.isEmpty(enrollments)}">
                        <i class="bi bi-inbox"></i> 수강중인 강좌가 없습니다.
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
