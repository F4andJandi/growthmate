<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>강좌 순서 편집</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-4">
        <h1>내 강좌 편집</h1>
        <a href="/myc" class="btn btn-outline-secondary mb-3">
            <i class="bi bi-arrow-left"></i> 돌아가기
        </a>
        <hr>

<table border="1" cellpadding="5">
    <tr>
        <th>순서</th>
        <th>강좌명</th>
        <th>액션</th>
    </tr>
    <tr th:each="enroll : ${enrollments}">
        <td th:text="${enroll.orderNum}"></td>
        <!-- courseId 대신 course.title 또는 course.id 사용 -->
        <td th:text="${enroll.course.title}"></td>
        <td>
            <form th:action="@{/change-order}" method="post" style="display:inline;">
                <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                <input type="number" name="newOrderNum" placeholder="새 순서" min="1"
                       th:max="${#lists.size(enrollments)}">
                <button type="submit">순서 변경</button>
            </form>

            <form th:action="@{/hide}" method="post" style="display:inline;">
                <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                <button type="submit">강좌 숨기기</button>
            </form>

            <form th:action="@{/refund}" method="post" style="display:inline;">
                <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                <button type="submit">강좌 환불</button>
            </form>
        </td>
    </tr>
</table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
