<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숨김 강좌 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f5f7;
            padding-top: 60px;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="mb-1">숨김 강좌</h1>
                <p class="text-muted mb-0" th:text="'숨김 처리된 강좌 ' + ${#lists.size(enrollments)} + '개'">
                    숨김 처리된 강좌 0개
                </p>
            </div>
            <a th:href="@{/myc}" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-left"></i> 돌아가기
            </a>
        </div>

        <!-- 강좌가 없는 경우 -->
        <div th:if="${#lists.isEmpty(enrollments)}" class="text-center py-5 text-muted border rounded bg-white">
            <i class="bi bi-eye-slash" style="font-size: 3rem;"></i>
            <p class="mt-3">숨김 처리된 강좌가 없습니다.</p>
        </div>

        <!-- 숨김 강좌 리스트 -->
        <div class="card" th:if="${!#lists.isEmpty(enrollments)}">
            <div class="card-body">
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center" 
                        th:each="enroll : ${enrollments}">
                        <div>
                            <span class="badge bg-secondary me-2">숨김</span>
                            <span th:text="${enroll.course.title}">강좌명</span>
                        </div>
                        <div class="btn-group">
                            <form th:action="@{/restore}" method="post" style="display:inline;">
                                <input type="hidden" name="enrollmentId" th:value="${enroll.id}">
                                <button type="submit" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-arrow-clockwise"></i> 복원
                                </button>
                            </form>
                            <a th:href="@{|/sections?courseId=${enroll.course.id}|}" 
                               class="btn btn-sm btn-outline-secondary">
                                <i class="bi bi-arrow-right-circle"></i> 보기
                            </a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
