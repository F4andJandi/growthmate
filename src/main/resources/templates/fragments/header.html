<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        html, body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <!-- 전역 헤더 Fragment -->
    <nav th:fragment="header" class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top" style="top: 0; left: 0; right: 0; z-index: 1030; margin: 0;">
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function() {
                const logoutBtn = document.getElementById('logoutBtn');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', async function() {
                        try {
                            const response = await fetch('/api/users/logout', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                }
                            });
                            
                            if (response.ok) {
                                // 로그아웃 성공 시 메인 페이지로 이동
                                window.location.href = '/';
                            }
                        } catch (error) {
                            console.error('Logout error:', error);
                            // 에러가 발생해도 메인 페이지로 이동
                            window.location.href = '/';
                        }
                    });
                }
            });
        </script>
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" th:href="@{/}">
                <i class="bi bi-mortarboard"></i> GrowthMate
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">
                            <i class="bi bi-house"></i> 메인
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/myc}">
                            <i class="bi bi-journal-bookmark"></i> 수강
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/points}">
                            <i class="bi bi-wallet2"></i> 포인트
                        </a>
                    </li>
                </ul>
                
                <!-- 로그인 상태 표시 -->
                <div class="d-flex align-items-center gap-3">
                    <div th:if="${loginUserId != null}" class="d-flex align-items-center gap-2">
                        <div class="text-success small d-flex align-items-center gap-1">
                            <i class="bi bi-person-check"></i>
                            <span th:text="${loginUserName != null ? loginUserName : '사용자'}">사용자</span>
                            <span class="text-muted" th:text="'(ID: ' + ${loginUserId} + ')'">(ID: 1)</span>
                            <span class="badge bg-secondary ms-1" th:text="${loginUserRole}">ROLE_STUDENT</span>
                        </div>
                        <button type="button" id="logoutBtn" class="btn btn-sm btn-outline-danger">
                            <i class="bi bi-box-arrow-right"></i> 로그아웃
                        </button>
                    </div>
                    <div th:unless="${loginUserId != null}" class="d-flex align-items-center gap-2">
                        <a th:href="@{/login}" class="btn btn-sm btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> 로그인
                        </a>
                        <a th:href="@{/signup}" class="btn btn-sm btn-outline-primary">
                            <i class="bi bi-person-plus"></i> 회원가입
                        </a>
                    </div>
                    
                    <div th:if="${loginUserRole == 'ROLE_INSTRUCTOR' or loginUserRole == 'INSTRUCTOR'}">
                        <a th:href="@{/instructor/courses}" class="btn btn-sm btn-primary">
                            <i class="bi bi-gear"></i> 강좌 관리
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
